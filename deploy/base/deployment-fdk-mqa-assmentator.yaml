apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-mqa-assmentator
  labels:
    app: fdk-mqa-assmentator
    fdk.service: fdk-mqa-assmentator
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-mqa-assmentator
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fdk-mqa-assmentator
        fdk.service: fdk-mqa-assmentator
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: fdk-mqa-assmentator
          image: fdk-mqa-assmentator
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: common
                  key: NAMESPACE
            - name: SCHEMA_REGISTRY
              valueFrom:
                secretKeyRef:
                  name: fdk-metadata-quality
                  key: SCHEMA_REGISTRY
            - name: BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-assmentator
                  key: BROKERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-assmentator
                  key: SECURITY_PROTOCOL
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-assmentator
                  key: SASL_MECHANISM
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-assmentator
                  key: USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-assmentator
                  key: PASSWORD
          resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
          livenessProbe:
            exec:
              command:
                - "true"
          readinessProbe:
            exec:
              command:
                - "true"
      restartPolicy: Always
