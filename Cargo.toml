[package]
name = "fdk-mqa-assmentator"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.14.0"
apache-avro = "0.21.0"
futures = "0.3.33"
lazy_static = "1.5.0"
oxigraph = "0.5.9"
prometheus = "0.14.0"
rdkafka = "0.39.0"
schema_registry_converter = { version = "4.10.0", features = ["avro", "futures", "rustls_tls"], default-features=false }
serde = "1.0.229"
serde_derive = "1.0.229"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber =  { version = "0.3.23", features = ["json", "env-filter", "tracing-log"] }
uuid = "1.24.0"

[dev-dependencies]
sophia_api= "0.9.0"
sophia_isomorphism = "0.9.0"
sophia_turtle = "0.9.0"
